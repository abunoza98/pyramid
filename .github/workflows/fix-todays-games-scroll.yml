name: Apply homepage and Australia Cup fixes

on:
  push:
    branches:
      - fix/todays-games-scroll

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/todays-games-scroll
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply fixes
        run: python .github/apply-homepage-australia-fix.py

      - name: Validate JavaScript and build
        run: |
          node --check assets/app.js
          node --check assets/render.js
          node --check scripts/leagues.mjs
          node --check scripts/backfill-cups.mjs
          rm -rf /tmp/pyramid-preview
          node scripts/build.mjs --preview /tmp/pyramid-preview
          grep -q 'data-strip-scroll="-1"' assets/render.js
          grep -q 'apiId: 874' scripts/leagues.mjs
          grep -q 'australia-cup' scripts/leagues.mjs

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-todays-games-scroll.yml .github/apply-homepage-australia-fix.py
          git add assets/app.js assets/render.js assets/style.css scripts/leagues.mjs scripts/backfill-cups.mjs
          git commit -m "Fix today's games scrolling and add Australia Cup"
          git push origin fix/todays-games-scroll
