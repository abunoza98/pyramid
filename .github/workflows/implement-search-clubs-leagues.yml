name: Implement unified club and league search

on:
  push:
    branches:
      - feature/search-clubs-leagues

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/search-clubs-leagues
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch source
        run: python scripts/implement-search-clubs-leagues.py
      - name: Validate JavaScript
        run: |
          node --check assets/app.js
          node --check assets/render.js
          node --check scripts/build.mjs
      - name: Build preview
        run: |
          rm -rf /tmp/pyramid-preview
          node scripts/build.mjs --preview /tmp/pyramid-preview
          cp /tmp/pyramid-preview/data/search.json data/search.json
      - name: Validate search output
        run: |
          node -e "const fs=require('fs'),a=require('assert'),s=JSON.parse(fs.readFileSync('data/search.json'));a(s.some(x=>x.type==='club'&&x.name==='Manchester City'));a(s.some(x=>x.type==='league'&&x.name==='Premier League'&&x.path==='england/'&&x.hash==='premier-league'));a(s.some(x=>x.type==='competition'&&x.name==='Champions League'));console.log('Validated '+s.length+' search entries')"
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-search-clubs-leagues.yml scripts/implement-search-clubs-leagues.py
          git add assets/app.js assets/render.js scripts/build.mjs data/search.json
          git commit -m "feat: search clubs and leagues"
          git push origin feature/search-clubs-leagues
