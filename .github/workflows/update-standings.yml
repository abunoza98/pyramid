name: Update standings

on:
  schedule:
    # Every hour, all day: the Americas, Asia and Australia play outside European hours.
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest tables and rebuild pages
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/update-standings.mjs
      - name: Commit if anything changed
        run: bash scripts/push.sh "Update standings"
