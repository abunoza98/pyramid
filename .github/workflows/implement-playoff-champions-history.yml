name: Implement playoff champions in historical tables

on:
  push:
    branches:
      - feature/playoff-champions-history

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playoff-champions-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch source
        run: python scripts/patch-playoff-champions.py
      - name: Validate JavaScript
        run: |
          node --check assets/render.js
          node --check scripts/build.mjs
          node --check scripts/leagues.mjs
      - name: Build preview
        run: |
          rm -rf /tmp/pyramid-preview
          node scripts/build.mjs --preview /tmp/pyramid-preview
      - name: Validate historical champions and brackets
        run: |
          node -e "const fs=require('fs'),a=require('assert'); const au=fs.readFileSync('/tmp/pyramid-preview/australia/2025-26/index.html','utf8'),us=fs.readFileSync('/tmp/pyramid-preview/usa/2025/index.html','utf8'),us24=fs.readFileSync('/tmp/pyramid-preview/usa/2024/index.html','utf8'); a(au.includes('Auckland FC')&&au.includes('🏆 Grand Final winner')&&au.includes('a-league-finals/')); a(us.includes('Inter Miami')&&us.includes('🏆 MLS Cup winner')&&us.includes('mls-cup-playoffs/')); a(us24.includes('🏆 MLS Cup winner')&&us24.includes('../mls-cup-playoffs/2024/index.html')); a(fs.existsSync('/tmp/pyramid-preview/usa/mls-cup-playoffs/2024/index.html')); a(fs.readFileSync('/tmp/pyramid-preview/australia/a-league-finals/index.html','utf8').includes('Grand Final')); a(fs.readFileSync('/tmp/pyramid-preview/usa/mls-cup-playoffs/index.html','utf8').includes('MLS Cup')); console.log('Historical playoff champions and bracket links validated')"
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-playoff-champions-history.yml scripts/patch-playoff-champions.py
          git add scripts/leagues.mjs scripts/build.mjs assets/render.js assets/style.css
          git commit -m "feat: mark playoff champions in historical tables"
          git push origin feature/playoff-champions-history
