name: Update fixtures

on:
  schedule:
    # Every 2 hours: catches kick-off changes and postponements. Live scores on the day come from the live worker.
    # About 40 requests a run, roughly 480 a day.
    - cron: "35 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Same group as the hourly tables job, so they never run (and push) at the same time.
concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch fixtures and rebuild pages
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/update-fixtures.mjs

      - name: Commit if anything changed
        run: bash scripts/push.sh "Update fixtures"
